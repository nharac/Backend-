# Despliegue continuo del backend de SAESU en el servidor de AWS.
# Corre cuando la CI de la rama main termina bien (o a mano desde la pestaña Actions).
# Entra al servidor por SSH, trae la rama main y reconstruye el contenedor.
#
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   EC2_HOST      dirección IP o dominio del servidor
#   EC2_USER      usuario SSH (por ejemplo ubuntu o ec2-user)
#   EC2_SSH_KEY   contenido completo de la llave privada .pem
#   EC2_RUTA_BACKEND  carpeta del backend en el servidor (por ejemplo /home/ubuntu/Backend-)
# El .env NO va en GitHub: debe existir ya en el servidor (en despliegue/.env con la arquitectura del anexo).
name: CD backend

on:
  workflow_run:
    workflows: [CI backend]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  desplegar:
    name: Desplegar en AWS
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: produccion
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
      - name: Verificar que estén los secretos
        if: env.EC2_HOST == ''
        run: |
          echo "::warning::Faltan los secretos EC2_HOST, EC2_USER, EC2_SSH_KEY y EC2_RUTA_BACKEND; no se despliega."
          exit 0

      - name: Actualizar y reconstruir en el servidor
        if: env.EC2_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.EC2_RUTA_BACKEND }}"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            # Arquitectura del anexo (despliegue/compose.yaml: NGINX + 2 backends + PostgreSQL + frontend)
            # si ya se configuró despliegue/.env en el servidor; si no, el contenedor único de antes.
            if [ -f despliegue/.env ]; then cd despliegue; docker compose up -d --build backend1 backend2 nginx; URL=http://localhost/api/instancia; else docker compose up -d --build; URL=http://localhost:8080/actuator/health; fi
            docker image prune -f
            # Spring Boot tarda de 30 s a 2 min en arrancar: se reintenta hasta 4 minutos.
            # 200/401/403 = ya atiende; 000/502 = todavía no. Va en una línea (ssh-action agrega código a cada línea).
            for i in $(seq 1 48); do c=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true); if [ "$c" = 200 ] || [ "$c" = 401 ] || [ "$c" = 403 ]; then echo "Backend arriba (HTTP $c)"; exit 0; fi; echo "Esperando a que arranque el backend ($i/48, HTTP $c)..."; sleep 5; done; echo "El backend no respondió en 4 minutos"; docker ps -a; exit 1
