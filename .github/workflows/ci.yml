# Integración continua del backend de SAESU.
# En cada push o Pull Request a las ramas principales: compila, corre las pruebas unitarias,
# genera la cobertura con JaCoCo, analiza con SonarQube (si hay token) y construye la imagen Docker.
name: CI backend

on:
  push:
    branches: [desarrollo, preproduccion, main]
  pull_request:
    branches: [desarrollo, preproduccion, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Compilar y probar
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SonarQube necesita el historial para asignar los cambios

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Las pruebas unitarias no necesitan base de datos ni claves: usan mocks.
      # La prueba que levanta todo Spring se salta sola porque DB_URL no está definida.
      - name: Pruebas unitarias y cobertura (mvn verify)
        run: mvn -B -ntp verify

      - name: Resumen de pruebas
        if: always()
        run: |
          total=$(grep -h -o 'tests="[0-9]*"' target/surefire-reports/TEST-*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          fallas=$(grep -h -o 'failures="[0-9]*"' target/surefire-reports/TEST-*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "### Pruebas del backend: ${total:-0} ejecutadas, ${fallas:-0} fallidas" >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/
          retention-days: 14

      - name: Guardar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: target/surefire-reports/
          retention-days: 14

      # Solo corre si el repositorio tiene los secretos SONAR_TOKEN y SONAR_HOST_URL
      # (Settings → Secrets and variables → Actions). Un SonarQube en localhost no es
      # alcanzable desde GitHub: hace falta SonarCloud o un SonarQube con dirección pública.
      - name: Análisis SonarQube
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        run: mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN"

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t saesu-backend:${{ github.sha }} .
