# ============================================================
# SAESU · Arquitectura del proyecto integrador (anexo de Sistemas Operativos)
#
#   navegador → NGINX (balanceador, único puerto público 80/443)
#                 ├── /        → frontend (Angular servido por NGINX)
#                 └── /api/    → backend1 | backend2 (Spring Boot, round robin)
#                                    └── db (PostgreSQL + volumen persistente)
#
# El MISMO archivo se usa on-premise (VirtualBox + Ubuntu Server) y en cloud (AWS EC2).
# Lo que cambia entre entornos va en el .env de esta carpeta (copiar desde .env.example).
#
#   docker compose build
#   docker compose up -d
#   docker compose ps
# ============================================================

name: saesu

x-backend: &backend
  build:
    context: ..
    dockerfile: Dockerfile
  image: saesu-backend:latest
  env_file: .env
  environment: &backend-env
    SPRING_PROFILES_ACTIVE: prod
    LOG_PATH: /app/logs
    # La base de datos es el contenedor "db" (red interna, nunca pública)
    DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-saesu}
    DB_USERNAME: ${POSTGRES_USER:-saesu}
    DB_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el .env}
    DB_DRIVER: org.postgresql.Driver
    JAVA_OPTS: ${BACKEND_JAVA_OPTS:--Xms96m -Xmx256m -XX:MaxMetaspaceSize=176m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=48m -Xss512k -XX:+UseSerialGC}
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  mem_limit: ${BACKEND_MEM_LIMIT:-480m}
  # Sin "ports": el backend solo se alcanza desde la red interna, a través de NGINX
  expose:
    - "8080"
  networks:
    - interna

services:
  db:
    image: postgres:17-alpine
    container_name: saesu-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saesu}
      POSTGRES_USER: ${POSTGRES_USER:-saesu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el .env}
      TZ: America/Bogota
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: ${DB_MEM_LIMIT:-200m}
    # Sin "ports": PostgreSQL NO se publica en el anfitrión ni en internet
    networks:
      - interna

  backend1:
    <<: *backend
    container_name: saesu-backend1
    environment:
      <<: *backend-env
      SAESU_INSTANCIA: backend1
      # Solo esta réplica ejecuta las tareas programadas (rachas, torneo, recordatorios)
      SAESU_TAREAS_PROGRAMADAS: "true"
    volumes:
      - ./logs/backend1:/app/logs

  backend2:
    <<: *backend
    container_name: saesu-backend2
    environment:
      <<: *backend-env
      SAESU_INSTANCIA: backend2
      SAESU_TAREAS_PROGRAMADAS: "false"
    volumes:
      - ./logs/backend2:/app/logs

  frontend:
    build:
      context: ${FRONTEND_DIR:-../../FrontEnd}
      dockerfile: Dockerfile
    image: saesu-frontend:latest
    container_name: saesu-frontend
    # Aquí el frontend solo sirve los archivos de Angular; la API la reparte el balanceador
    volumes:
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    mem_limit: 64m
    expose:
      - "80"
    networks:
      - interna

  nginx:
    image: nginx:1.27-alpine
    container_name: saesu-nginx
    depends_on:
      - frontend
      - backend1
      - backend2
    ports:
      - "${PUERTO_HTTP:-80}:80"
    volumes:
      - ./nginx/balanceador.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - interna

volumes:
  # Datos de PostgreSQL: sobreviven a "docker compose down" y a reconstruir imágenes
  # (solo se borran con "docker compose down -v")
  pgdata:
    name: saesu-pgdata

networks:
  interna:
    name: saesu-interna
