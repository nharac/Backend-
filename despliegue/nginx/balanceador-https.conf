# Igual que balanceador.conf pero con HTTPS (entorno cloud con dominio y certificado)

upstream api_backend {
    server backend1:8080 max_fails=2 fail_timeout=10s;
    server backend2:8080 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

# HTTP → HTTPS (y desafío de Let's Encrypt para renovar el certificado)
server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificado de Let's Encrypt del dominio de SAESU (ver docs/https.md del frontend)
    ssl_certificate     /etc/letsencrypt/live/saesu.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saesu.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Fotos de perfil e imágenes del foro (mismo límite que el backend)
    client_max_body_size 10M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Qué réplica atendió (también lo manda el backend en X-Instancia)
    add_header X-Upstream $upstream_addr always;

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Si una réplica está caída, la petición pasa a la otra
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 3s;

        # El tutor IA puede tardar hasta un minuto
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Swagger (opcional, útil para la sustentación)
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
