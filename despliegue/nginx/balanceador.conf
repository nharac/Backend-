# NGINX: proxy inverso y balanceador de SAESU.
# Es el ÚNICO contenedor con puerto público. Reparte /api/ entre las dos réplicas del backend
# (round robin) y si una no responde reintenta en la otra.

upstream api_backend {
    server backend1:8080 max_fails=2 fail_timeout=10s;
    server backend2:8080 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Fotos de perfil e imágenes del foro (mismo límite que el backend)
    client_max_body_size 10M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Qué réplica atendió (también lo manda el backend en X-Instancia)
    add_header X-Upstream $upstream_addr always;

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Si una réplica está caída, la petición pasa a la otra
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 3s;

        # El tutor IA puede tardar hasta un minuto
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Swagger (opcional, útil para la sustentación)
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
