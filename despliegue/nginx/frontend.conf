# NGINX interno del contenedor frontend: solo sirve los archivos de Angular.
# (La API la reparte el balanceador; este contenedor no habla con el backend.)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(js|css|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
