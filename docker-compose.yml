services:
  saesu-backend:
    build: .
    container_name: saesu-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - LOG_PATH=/app/logs
    volumes:
      # Los logs sobreviven a reconstruir el contenedor: quedan en ./logs del servidor
      - ./logs:/app/logs
    restart: unless-stopped
    # Tope de memoria del contenedor: si Java se pasa, Docker reinicia solo este
    # contenedor en vez de dejar sin memoria a todo el servidor.
    mem_limit: 700m
    networks:
      - saesu-network

networks:
  saesu-network:
    name: saesu-network