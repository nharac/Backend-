
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saesu-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - saesu-network

networks:
  saesu-network:
    name: saesu-network
    driver: bridge
