# =====================================================================
# Perfil de producción (docker-compose lo activa con SPRING_PROFILES_ACTIVE=prod)
# Solo cambia lo que debe ser distinto en el servidor; el resto sale de
# application.properties y de las variables de entorno (.env).
# =====================================================================

# Sin SQL en consola: llena el log y puede mostrar datos de los usuarios
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Detrás de nginx: respetar X-Forwarded-* para URLs y esquema correctos
server.forward-headers-strategy=framework

# Errores sin detalles internos hacia el cliente
server.error.include-stacktrace=never
server.error.include-message=never

# Salud: el detalle completo solo para quien esté autenticado
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Logs a archivo (ver logback-spring.xml). En el contenedor queda en /app/logs
logging.level.co.edu.ucundinamarca.saesu=${LOG_LEVEL:INFO}
