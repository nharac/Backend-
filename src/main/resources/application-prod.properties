# =====================================================================
# Perfil de producción (docker-compose lo activa con SPRING_PROFILES_ACTIVE=prod)
# Solo cambia lo que debe ser distinto en el servidor; el resto sale de
# application.properties y de las variables de entorno (.env).
# =====================================================================

# Sin SQL en consola: llena el log y puede mostrar datos de los usuarios
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Detrás de nginx: respetar X-Forwarded-* para URLs y esquema correctos
server.forward-headers-strategy=framework

# Errores sin detalles internos hacia el cliente
server.error.include-stacktrace=never
server.error.include-message=never

# Recursos para una instancia pequeña (AWS t3.micro con 1 GB de RAM)
# - Conexiones a Supabase: 5 bastan porque cada consulta dura milisegundos y el plan
#   gratuito de Supabase limita las conexiones totales.
# - Tomcat: hasta 50 peticiones atendiéndose al mismo tiempo; las demás esperan en cola
#   (hasta 100) en vez de rechazarse. Cada hilo gasta memoria, por eso no 200.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=2
server.tomcat.threads.max=${TOMCAT_HILOS_MAX:50}
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=100

# Salud: el detalle completo solo para quien esté autenticado
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Logs a archivo (ver logback-spring.xml). En el contenedor queda en /app/logs
logging.level.co.edu.ucundinamarca.saesu=${LOG_LEVEL:INFO}
