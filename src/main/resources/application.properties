spring.application.name=saesu-backend
# La autenticación es con JWT propio: sin esto Spring crea un usuario en memoria con contraseña aleatoria en el log
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ===== Base de Datos (valores desde .env) =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# ===== JPA / Hibernate =====
# Cambiado a 'validate' porque Flyway maneja el esquema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Flyway - Migraciones de BD =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ===== Servidor =====
server.port=${SERVER_PORT:8080}
# Al apagar el contenedor termina las peticiones en curso (factor IX: arranque rápido y apagado limpio)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ===== Logs (formato y archivos en logback-spring.xml) =====
logging.level.co.edu.ucundinamarca.saesu=${LOG_LEVEL:INFO}

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== Swagger / OpenAPI =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# ===== Gemini IA =====
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# ===== Chat =====
chat.limite.diario=${CHAT_LIMITE_DIARIO:50}
chat.historial.max=${CHAT_HISTORIAL_MAX:20}

# ===== Actuator - Health Check =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===== Caché (Caffeine) =====
spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=60m,maximumSize=500

# ===== Envío de Correos (Gmail) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Nombre que ve el destinatario como remitente y URL de la app para los botones de los correos
mail.remitente.nombre=${MAIL_FROM_NAME:SAESU}
app.url=${APP_URL:http://localhost}

# ===== AWS S3 =====
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.bucket-name=${AWS_BUCKET_NAME}

# ===== Limites de subida de archivos =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB